# Render "Blueprint" for the backend (optional shortcut — docs/deploy-free.md also shows the manual dashboard steps).
# NOTE: written from Render's docs but not run against a real Render account; if Render rejects a field,
# create the service by hand following the guide instead.
# Secret values are never stored here: every `sync: false` entry is typed into the Render dashboard.
services:
  - type: web
    name: sweetshop-backend
    runtime: docker
    plan: free
    region: singapore # closest free region to India; keep the Neon database in the same region
    rootDir: sweetshop-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/shop-settings
    envVars:
      # Database (Neon) — use the DIRECT (not pooled) host
      - key: DB_URL
        sync: false # jdbc:postgresql://<neon-host>/<dbname>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your Netlify site URL, e.g. https://your-shop.netlify.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Images (Cloudinary) — Render's free disk is wiped on every deploy
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional extras
      - key: CALLMEBOT_PHONE
        sync: false
      - key: CALLMEBOT_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
