spring.application.name=sweetshop-backend

# Optional, gitignored sweetshop-backend/.env for local runs (e.g. CALLMEBOT_PHONE / CALLMEBOT_API_KEY) so
# personal values and secrets never land in this committed file. Real env vars still win; missing file is fine.
spring.config.import=optional:file:.env[.properties]

# Database connection (override DB_URL/DB_USERNAME/DB_PASSWORD via env vars for Docker or anything beyond local dev)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sweetshop_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234567890}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small pool + short connection lifetime: free hosted Postgres (e.g. Neon) caps connections and drops idle
# ones, and the app runs in ~512 MB. Override DB_POOL_SIZE if you move to a bigger plan.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=300000

# Hosts like Render tell the app which port to listen on via PORT
server.port=${PORT:8080}

# Let Flyway own the schema; Hibernate only validates entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (override JWT_SECRET via env var in anything beyond local dev)
# Access token is short-lived (15 min default); the refresh token (below) mints new ones silently.
jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-change-me-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# Refresh-token cookie. In production over HTTPS set APP_COOKIE_SECURE=true; if the frontend and
# API live on different sites, also set APP_COOKIE_SAME_SITE=None (requires Secure).
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}

# Google "Sign in with Google": the OAuth Web client ID (public, not a secret). Only ID tokens issued
# for this exact client are accepted. Create/manage it at console.cloud.google.com -> Credentials.
google.client-id=${GOOGLE_CLIENT_ID:828148473302-cllpoq82fu1jn8leuk6marbsf4ra61sc.apps.googleusercontent.com}

# CORS (override CORS_ALLOWED_ORIGINS via env var in anything beyond local dev)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Include specific error reasons (e.g. "Invalid email or password") in API error responses.
# Safe here because our ResponseStatusException messages are hand-written for end users,
# never raw exception text that could leak internals.
server.error.include-message=always

# Product image uploads — local disk storage under the backend's working directory,
# served back via WebConfig's static resource mapping at /uploads/products/**.
app.upload.dir=uploads/products

# Product images on Cloudinary (free) — optional. Needed on hosts whose disk is wiped on every deploy
# (e.g. Render free). With the three values blank, uploads stay on the local disk as before.
# api-secret is a secret: env var only, never commit it.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:sweetshop/products}
cloudinary.api-base=https://api.cloudinary.com
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# WhatsApp new-order alerts to the shop owner via CallMeBot (free, personal use) — optional: with the
# phone/key blank nothing is sent. Setup: add CallMeBot's WhatsApp number to your contacts and message it
# "I allow callmebot to send me messages" (see https://www.callmebot.com/blog/free-api-whatsapp-messages/);
# it replies with your API key. CALLMEBOT_PHONE is your number with country code, e.g. +919876543210.
# The api key is a secret: env var only, never commit it.
whatsapp.callmebot.url=https://api.callmebot.com/whatsapp.php
whatsapp.callmebot.phone=${CALLMEBOT_PHONE:}
whatsapp.callmebot.api-key=${CALLMEBOT_API_KEY:}

# Razorpay (online payment, optional at checkout) — no safe default, unlike JWT_SECRET.
# Get test keys from the Razorpay dashboard (Test Mode) at https://dashboard.razorpay.com
# and set them as env vars (or in a local, gitignored .env) before using "Pay online now" at checkout.
# NEVER hardcode real keys here — this file is committed to source control.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
