services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sweetshop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Postgres 18's official image manages its own versioned subdirectory under
      # /var/lib/postgresql — mounting at .../data (the pre-18 convention) makes it refuse to start.
      - postgres_data:/var/lib/postgresql
    # Not exposed to the host on purpose — only "backend" needs to reach it, over the
    # compose-internal network as host "postgres". Uncomment if you want host access
    # (e.g. via psql) and nothing else on your machine is already using 5432.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweetshop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./sweetshop-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sweetshop_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Same dev-only fallback as application.properties uses outside Docker — passing an
      # empty string here (as ${JWT_SECRET:-} would) overrides Spring's own default instead
      # of falling through to it, and crashes the app at startup (empty HMAC key). Set a
      # real JWT_SECRET in .env for anything beyond local trial.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-do-not-use-in-production-change-me-1234567890}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Only set GOOGLE_CLIENT_ID when you have one: a blank value would override the app's default
      # (same set-but-empty trap as JWT_SECRET above), so fall back to the same default instead.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-828148473302-cllpoq82fu1jn8leuk6marbsf4ra61sc.apps.googleusercontent.com}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Lax}
      CALLMEBOT_PHONE: ${CALLMEBOT_PHONE:-}
      CALLMEBOT_API_KEY: ${CALLMEBOT_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./sweetshop-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-828148473302-cllpoq82fu1jn8leuk6marbsf4ra61sc.apps.googleusercontent.com}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
